# ArgoCD Image Updater - watches DockerHub for v1.0.<sha> tags pushed by CI
# allowTags: regexp:^v1\.0\. matches tags like v1.0.abc1234
# (CI switched from git-<sha> to v1.0.<sha> around 2026-04-30; verified against
# actual DockerHub tags on 2026-08-13 — no service publishes git-<sha> anymore)
---
# MCP Server (uses :latest tag — digest strategy detects new pushes)
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: internal-mcp-server
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd
  commonUpdateSettings:
    updateStrategy: digest
  applicationRefs:
    - namePattern: internal-mcp-server
      images:
        - alias: mcp-server
          imageName: lifegoeson34/mcp-server:latest
          manifestTargets:
            kustomize:
              name: lifegoeson34/mcp-server
---
# Backend Auth Service
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: modami-be-modami-auth-service
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd
  commonUpdateSettings:
    updateStrategy: newest-build
    allowTags: "regexp:^v1\\.0\\."
  applicationRefs:
    - namePattern: modami-be-modami-auth-service
      images:
        - alias: auth
          imageName: lifegoeson34/be-modami-auth-service
          manifestTargets:
            kustomize:
              name: lifegoeson34/be-modami-auth-service
---
# Backend User Service
# Uses digest strategy on :latest — allowTags regexp:^v1\.0\. was resurrecting
# v1.0.276e4f4 (pushed 2026-04-28) as "newest-build" every reconcile since CI
# stopped publishing v1.0.* tags for this service after that; that stale build
# has a broken down-migration and crashlooped the deployment. CI now only
# pushes :latest, so track its digest instead (same fix already applied to ASR).
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: modami-be-modami-user-service
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd
  commonUpdateSettings:
    updateStrategy: digest
  applicationRefs:
    - namePattern: modami-be-modami-user-service
      images:
        - alias: user
          imageName: lifegoeson34/be-modami-user-service:latest
          manifestTargets:
            kustomize:
              name: lifegoeson34/be-modami-user-service
