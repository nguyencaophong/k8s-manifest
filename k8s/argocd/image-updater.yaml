# ArgoCD Image Updater - thêm vào ArgoCD hiện có
# Watches DockerHub for new pushes on :latest tag.
---
# Backend Auth Service
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: modami-be-modami-auth-service
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd
  commonUpdateSettings:
    updateStrategy: newest-build
  applicationRefs:
    - namePattern: modami-be-modami-auth-service
      images:
        - alias: auth
          imageName: lifegoeson34/be-modami-auth-service:latest
          manifestTargets:
            kustomize:
              name: lifegoeson34/be-modami-auth-service
---
# Backend User Service
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: modami-be-modami-user-service
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd
  commonUpdateSettings:
    updateStrategy: newest-build
  applicationRefs:
    - namePattern: modami-be-modami-user-service
      images:
        - alias: user
          imageName: lifegoeson34/be-modami-user-service:latest
          manifestTargets:
            kustomize:
              name: lifegoeson34/be-modami-user-service
---
# Backend Core Service
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: modami-be-modami-core-service
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd
  commonUpdateSettings:
    updateStrategy: newest-build
  applicationRefs:
    - namePattern: modami-be-modami-core-service
      images:
        - alias: core
          imageName: lifegoeson34/be-modami-core-service:latest
          manifestTargets:
            kustomize:
              name: lifegoeson34/be-modami-core-service
