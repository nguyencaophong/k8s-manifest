# ArgoCD Image Updater v1.1.1 - CRD-based configuration
# Watches DockerHub for new pushes on :latest tag.
# Strategy: latest - re-syncs whenever the :latest tag points to a new image.
# Write-back: argocd - patches the live ArgoCD Application parameter directly.
#
# allowTags regex "^latest$" pins tracking to the :latest tag only.
---
# Backend API Service
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: techinsight-be-api-service
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd
  commonUpdateSettings:
    updateStrategy: newest-build
    allowTags: "latest"
  applicationRefs:
    - namePattern: techinsight-be-api-service
      images:
        - alias: api
          imageName: lifegoeson34/techinsight-core-service:latest
          manifestTargets:
            kustomize:
              name: lifegoeson34/techinsight-core-service
---
