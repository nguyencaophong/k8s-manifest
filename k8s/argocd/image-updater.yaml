# ArgoCD Image Updater v1.1.1 - CRD-based configuration
# Watches DockerHub for new image digests on :latest tag.
# Strategy: digest - triggers on every new push to :latest even without new tag.
# Write-back: argocd - patches the live ArgoCD Application parameter directly
#   (no git commit needed; ArgoCD then syncs the new digest into the cluster).
#
# For git write-back (alternative): set method: git and configure argocd-image-updater-secret
#   kubectl patch secret argocd-image-updater-secret -n argocd \
#     --type=merge -p '{"stringData":{"git.user":"<user>","git.password":"<token>"}}'
---
# Backend API Service
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: techinsight-be-api-service
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd
  commonUpdateSettings:
    updateStrategy: digest
    allowTags: "latest"
  applicationRefs:
    - namePattern: techinsight-be-api-service
      images:
        - alias: api
          imageName: lifegoeson34/techinsight-core-service
          manifestTargets:
            kustomize:
              name: lifegoeson34/techinsight-core-service
---
