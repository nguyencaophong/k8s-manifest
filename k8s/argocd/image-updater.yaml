# ArgoCD Image Updater - watches DockerHub for git-<sha> tags pushed by Jenkins
# allowTags: regexp:^git- matches tags like git-abc1234
---
# Backend Auth Service
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: modami-be-modami-auth-service
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd
  commonUpdateSettings:
    updateStrategy: newest-build
    allowTags: "regexp:^git-"
  applicationRefs:
    - namePattern: modami-be-modami-auth-service
      images:
        - alias: auth
          imageName: lifegoeson34/be-modami-auth-service
          manifestTargets:
            kustomize:
              name: lifegoeson34/be-modami-auth-service
