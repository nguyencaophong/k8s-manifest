# Argo CD Application: Backend Core Service
# Repo: https://github.com/nguyencaophong/be-techinsights-core-service
# Nếu manifest K8s ở path khác (vd. deploy/), sửa spec.source.path rồi apply.
# Apply: kubectl apply -f k8s/argocd/application-core-service.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: be-techinsights-core
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nguyencaophong/be-techinsights-core-service.git
    targetRevision: HEAD
    path: k8s
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: techinsight
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    # Tự sync từ Git khi có thay đổi (bỏ comment nếu cần):
    # automated: {}
