# ArgoCD Application cho shared resources của modami (namespace, secrets, serviceaccounts, ingress, pdb)
# Apply: kubectl apply -f k8s/argocd/modami-base.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: modami-base
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: modami
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nguyencaophong/k8s-manifest.git
    targetRevision: HEAD
    path: k8s/modami/base
  destination:
    server: https://kubernetes.default.svc
    namespace: modami
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
