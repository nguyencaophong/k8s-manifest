apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lingocast-be-lingocast-job-scheduler
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: lingocast
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nguyencaophong/k8s-manifest.git
    targetRevision: HEAD
    path: k8s/apps/lingocast/be-lingocast-job-scheduler
  destination:
    server: https://kubernetes.default.svc
    namespace: lingocast
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
