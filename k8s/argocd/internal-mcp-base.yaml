# ArgoCD Application: internal-mcp shared resources (namespace, serviceaccounts, ingress, certs)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: internal-mcp-base
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: internal-mcp
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nguyencaophong/k8s-manifest.git
    targetRevision: HEAD
    path: k8s/base/internal-mcp
  destination:
    server: https://kubernetes.default.svc
    namespace: internal-mcp
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
