# ArgoCD Application: shared resources (namespace, secrets, serviceaccounts, ingress, certs, pdb, consul-templates)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: techinsight-base
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: techinsight
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nguyencaophong/k8s-manifest.git
    targetRevision: HEAD
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: techinsight
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
