# Argo CD Application: Notification Service
# Sửa spec.source.repoURL nếu repo khác.
# Apply: kubectl apply -f k8s/argocd/application-notification-service.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: be-techinsights-notification
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nguyencaophong/be-techinsights-notification-service.git
    targetRevision: HEAD
    path: k8s
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: techinsight
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    # automated: {}