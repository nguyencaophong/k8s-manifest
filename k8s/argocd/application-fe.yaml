# Argo CD Application: Frontend (FE) Service
# Sửa spec.source.repoURL nếu repo khác.
# Apply: kubectl apply -f k8s/argocd/application-fe.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fe-techinsight
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nguyencaophong/fe-techinsight.git
    targetRevision: HEAD
    path: k8s
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: techinsight
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    # automated: {}