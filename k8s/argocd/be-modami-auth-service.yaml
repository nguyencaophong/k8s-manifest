# Thêm vào ArgoCD namespace hiện có (techinsight) - KHÔNG tạo root-app riêng
# Apply: kubectl apply -f k8s/argocd/be-modami-auth-service.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: modami-be-modami-auth-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: modami
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nguyencaophong/k8s-manifest.git
    targetRevision: HEAD
    path: k8s/apps/be-modami-auth-service
  destination:
    server: https://kubernetes.default.svc
    namespace: modami
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
