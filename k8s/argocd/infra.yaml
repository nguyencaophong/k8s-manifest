# ArgoCD Application: Infrastructure (MongoDB, Redis, Kafka, MinIO, Elasticsearch, Kibana, Grafana, Prometheus, OTel, Redpanda Console)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: techinsight-infra
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: techinsight
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nguyencaophong/k8s-manifest.git
    targetRevision: HEAD
    path: k8s/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: techinsight
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
