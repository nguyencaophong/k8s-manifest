# Argo CD Application: Admin (FE Admin) Service
# Sửa spec.source.repoURL nếu repo khác.
# Apply: kubectl apply -f k8s/argocd/application-admin-service.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fe-techinsights-admin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nguyencaophong/fe-techinsights-admin.git
    targetRevision: HEAD
    path: k8s
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: techinsight
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    # automated: {}