apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: internal-mcp-server
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: internal-mcp
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nguyencaophong/k8s-manifest.git
    targetRevision: HEAD
    path: k8s/apps/internal-mcp/mcp-server
    kustomize:
      images:
        - lifegoeson34/mcp-server:v1.0.dbb4dee@sha256:48acffc2a2b9f26b6e5764ed597accb2a83d3ae44554d10977ae17c7f94f3fe5
  destination:
    server: https://kubernetes.default.svc
    namespace: internal-mcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
