apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-analyze-and-summarizer-asr-summary-worker
  namespace: lingocast
  labels:
    app: voice-analyze-and-summarizer-asr-summary-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-analyze-and-summarizer-asr-summary-worker
  template:
    metadata:
      labels:
        app: voice-analyze-and-summarizer-asr-summary-worker
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-limits-cpu: "50m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/role: "voice-analyze-and-summarizer-asr"
        vault.hashicorp.com/agent-inject-token: "true"
    spec:
      serviceAccountName: voice-analyze-and-summarizer-asr
      initContainers:
        - name: consul-template
          image: hashicorp/consul-template:0.37.6
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          env:
            - name: CONSUL_HTTP_ADDR
              value: "http://consul-server.consul.svc.cluster.local:8500"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
          volumeMounts:
            - name: config-output
              mountPath: /app/config
          command:
            - /bin/sh
            - -c
            - |
              export VAULT_ADDR="${VAULT_ADDR:-http://vault.vault.svc.cluster.local:8200}"
              if [ -f /vault/secrets/token ]; then export VAULT_TOKEN=$(cat /vault/secrets/token); elif [ -f /vault/secrets/.vault-token ]; then export VAULT_TOKEN=$(cat /vault/secrets/.vault-token); fi
              wget -qO /tmp/tpl.yml "${CONSUL_HTTP_ADDR}/v1/kv/lingocast/templates/voice-analyze-and-summarizer-asr?raw"
              consul-template -template "/tmp/tpl.yml:/app/config/.env" -once
      containers:
        - name: summary-worker
          image: lifegoeson34/voice-analyze-and-summarizer-asr:latest
          # Overrides only CMD; ENTRYPOINT stays /opt/nvidia/nvidia_entrypoint.sh so it still execs this.
          args:
            - python3
            - -m
            - workers.summary_worker
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: config-output
              mountPath: /app/.env
              subPath: .env
              readOnly: true
      volumes:
        - name: config-output
          emptyDir: {}
