apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-analyze-and-summarizer-asr-worker
  namespace: lingocast
  labels:
    app: voice-analyze-and-summarizer-asr-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-analyze-and-summarizer-asr-worker
  template:
    metadata:
      labels:
        app: voice-analyze-and-summarizer-asr-worker
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-limits-cpu: "50m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/role: "voice-analyze-and-summarizer-asr"
        vault.hashicorp.com/agent-inject-token: "true"
    spec:
      serviceAccountName: voice-analyze-and-summarizer-asr
      initContainers:
        - name: consul-template
          image: hashicorp/consul-template:0.37.6
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          env:
            - name: CONSUL_HTTP_ADDR
              value: "http://consul-server.consul.svc.cluster.local:8500"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
          volumeMounts:
            - name: config-output
              mountPath: /app/config
          command:
            - /bin/sh
            - -c
            - |
              export VAULT_ADDR="${VAULT_ADDR:-http://vault.vault.svc.cluster.local:8200}"
              if [ -f /vault/secrets/token ]; then export VAULT_TOKEN=$(cat /vault/secrets/token); elif [ -f /vault/secrets/.vault-token ]; then export VAULT_TOKEN=$(cat /vault/secrets/.vault-token); fi
              wget -qO /tmp/tpl.yml "${CONSUL_HTTP_ADDR}/v1/kv/lingocast/templates/voice-analyze-and-summarizer-asr?raw"
              consul-template -template "/tmp/tpl.yml:/app/config/.env" -once
      containers:
        - name: asr-worker
          image: lifegoeson34/asr-worker:latest
          # workers/asr_worker.py reads os.getenv() directly (no load_dotenv()), so
          # /app/.env must be sourced into real env vars before exec.
          # TEMP WORKAROUND: image was built without flask, but app/__init__.py
          # (imported transitively via app.services) requires it. Install it into a
          # writable dir at startup until the image is rebuilt with flask included.
          command:
            - /bin/sh
            - -c
            - |
              set -a
              . /app/.env
              set +a
              pip install --quiet --target=/tmp/extra-pylibs flask
              export PYTHONPATH="/tmp/extra-pylibs:${PYTHONPATH}"
              exec python -m workers.asr_worker
          env:
            # site-packages is owned by root (mode 755); appuser can't write numba's
            # JIT cache next to librosa's source files there, which crashes librosa
            # import with "cannot cache function ... no locator available". Redirect
            # the cache to a dir appuser actually owns.
            - name: NUMBA_CACHE_DIR
              value: "/tmp/numba_cache"
          resources:
            # cpu request kept minimal - node has almost no headroom (98% of 4 vCPU
            # already requested by other workloads). Limit stays high so it can
            # burst into whatever CPU is actually free during transcription.
            requests:
              memory: "512Mi"
              cpu: "20m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: config-output
              mountPath: /app/.env
              subPath: .env
              readOnly: true
      volumes:
        - name: config-output
          emptyDir: {}
