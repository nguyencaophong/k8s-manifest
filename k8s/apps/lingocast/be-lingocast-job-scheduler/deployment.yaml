apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-lingocast-job-scheduler
  namespace: lingocast
  labels:
    app: be-lingocast-job-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: be-lingocast-job-scheduler
  template:
    metadata:
      labels:
        app: be-lingocast-job-scheduler
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-limits-cpu: "50m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/role: "be-lingocast-job-scheduler"
        vault.hashicorp.com/agent-inject-token: "true"
    spec:
      serviceAccountName: be-lingocast-job-scheduler
      initContainers:
        - name: consul-template
          image: hashicorp/consul-template:0.37.6
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          env:
            - name: CONSUL_HTTP_ADDR
              value: "http://consul-server.consul.svc.cluster.local:8500"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
          volumeMounts:
            - name: config-output
              mountPath: /app/config
          command:
            - /bin/sh
            - -c
            - |
              export VAULT_ADDR="${VAULT_ADDR:-http://vault.vault.svc.cluster.local:8200}"
              if [ -f /vault/secrets/token ]; then export VAULT_TOKEN=$(cat /vault/secrets/token); elif [ -f /vault/secrets/.vault-token ]; then export VAULT_TOKEN=$(cat /vault/secrets/.vault-token); fi
              wget -qO /tmp/tpl.yml "${CONSUL_HTTP_ADDR}/v1/kv/lingocast/templates/be-lingocast-job-scheduler?raw"
              wget -qO /tmp/tpl-cookies.yml "${CONSUL_HTTP_ADDR}/v1/kv/lingocast/templates/be-lingocast-job-scheduler-yt-cookies?raw"
              consul-template -template "/tmp/tpl.yml:/app/config/config.yaml" -template "/tmp/tpl-cookies.yml:/app/config/yt-cookies.txt" -once
      containers:
        - name: job-scheduler
          image: lifegoeson34/be-lingocast-job-scheduler:latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          env:
            - name: YTDLP_COOKIES_FILE
              value: "/app/config/yt-cookies.txt"
          volumeMounts:
            - name: config-output
              mountPath: /app/config
          command: ["/bin/sh", "-c", "exec ./main"]
      volumes:
        - name: config-output
          emptyDir: {}
