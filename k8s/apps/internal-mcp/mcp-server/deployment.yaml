apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: internal-mcp
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server
      containers:
        - name: mcp-server
          image: lifegoeson34/mcp-server:latest
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          ports:
            - containerPort: 3333
              name: http
          envFrom:
            - secretRef:
                name: mcp-server-env
          livenessProbe:
            tcpSocket:
              port: 3333
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 3333
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: internal-mcp
spec:
  selector:
    app: mcp-server
  ports:
    - port: 3333
      targetPort: 3333
      name: http
  type: ClusterIP
