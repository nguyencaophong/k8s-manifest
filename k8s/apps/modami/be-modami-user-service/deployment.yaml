apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-modami-user-service
  namespace: modami
  labels:
    app: be-modami-user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: be-modami-user-service
  template:
    metadata:
      labels:
        app: be-modami-user-service
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-limits-cpu: "50m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/role: "be-modami-user-service"
        vault.hashicorp.com/agent-inject-token: "true"
    spec:
      serviceAccountName: be-modami-user-service
      initContainers:
        - name: consul-template
          image: hashicorp/consul-template:0.37.6
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          env:
            - name: CONSUL_HTTP_ADDR
              value: "http://consul-server.consul.svc.cluster.local:8500"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
          volumeMounts:
            - name: config-output
              mountPath: /app/config
          command:
            - /bin/sh
            - -c
            - |
              export VAULT_ADDR="${VAULT_ADDR:-http://vault.vault.svc.cluster.local:8200}"
              if [ -f /vault/secrets/token ]; then export VAULT_TOKEN=$(cat /vault/secrets/token); elif [ -f /vault/secrets/.vault-token ]; then export VAULT_TOKEN=$(cat /vault/secrets/.vault-token); fi
              wget -qO /tmp/tpl.yml "${CONSUL_HTTP_ADDR}/v1/kv/modami/templates/be-modami-user-service?raw"
              consul-template -template "/tmp/tpl.yml:/app/config/config.yml" -once
      containers:
        - name: user
          image: lifegoeson34/be-modami-user-service:latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 8086
              name: http
            - containerPort: 50050
              name: grpc
          volumeMounts:
            - name: config-output
              mountPath: /app/config
              readOnly: true
          command: ["/bin/sh", "-c", "exec ./main"]
          livenessProbe:
            tcpSocket:
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: config-output
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: be-modami-user-service
  namespace: modami
spec:
  selector:
    app: be-modami-user-service
  ports:
    - name: http
      port: 8086
      targetPort: 8086
    - name: grpc
      appProtocol: grpc
      port: 50050
      targetPort: 50050
  type: ClusterIP
