apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-service
  namespace: techinsight
  labels:
    app: fe-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fe-service
  template:
    metadata:
      labels:
        app: fe-service
    spec:
      serviceAccountName: fe-service
      containers:
        - name: web
          image: lifegoeson34/techinsight-web:latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_CORE_URL
              value: "https://api.techinsightsworld.com"
            - name: NEXT_PUBLIC_MINIO_ENDPOINT
              value: "minio.techinsightsworld.com"
            - name: NEXT_PUBLIC_MINIO_PUBLIC_URL
              value: "https://minio.techinsightsworld.com"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fe-service
  namespace: techinsight
spec:
  selector: 
    app: fe-service
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
