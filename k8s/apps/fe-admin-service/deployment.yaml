apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-admin-service
  namespace: techinsight
  labels:
    app: fe-admin-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fe-admin-service
  template:
    metadata:
      labels:
        app: fe-admin-service
    spec:
      serviceAccountName: fe-admin-service
      containers:
        - name: admin
          image: lifegoeson34/techinsight-admin:latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 3000
          env:
            - name: API_URL
              value: "http://core-service:8080/v1"
            - name: VITE_API_URL
              value: "https://core.techinsightsworld.com/v1"
            - name: VITE_MINIO_DOMAIN
              value: "https://minio.techinsightsworld.com"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fe-admin-service
  namespace: techinsight
spec:
  selector:
    app: fe-admin-service
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
