apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-modami-noti-service-worker-dispatch
  namespace: modami
  labels:
    app: be-modami-noti-service-worker-dispatch
spec:
  replicas: 3
  selector:
    matchLabels:
      app: be-modami-noti-service-worker-dispatch
  template:
    metadata:
      labels:
        app: be-modami-noti-service-worker-dispatch
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-limits-cpu: "50m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/role: "be-modami-noti-service-worker-dispatch"
        vault.hashicorp.com/agent-inject-token: "true"
    spec:
      serviceAccountName: be-modami-noti-service-worker-dispatch
      initContainers:
        - name: consul-template
          image: hashicorp/consul-template:0.37.6
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          env:
            - name: CONSUL_HTTP_ADDR
              value: "http://consul-server.consul.svc.cluster.local:8500"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
          volumeMounts:
            - name: config-output
              mountPath: /app/config
          command:
            - /bin/sh
            - -c
            - |
              export VAULT_ADDR="${VAULT_ADDR:-http://vault.vault.svc.cluster.local:8200}"
              if [ -f /vault/secrets/token ]; then export VAULT_TOKEN=$(cat /vault/secrets/token); elif [ -f /vault/secrets/.vault-token ]; then export VAULT_TOKEN=$(cat /vault/secrets/.vault-token); fi
              wget -qO /tmp/tpl.yml "${CONSUL_HTTP_ADDR}/v1/kv/modami/templates/be-modami-noti-service?raw"
              consul-template -template "/tmp/tpl.yml:/app/config/config.yaml" -once
      containers:
        - name: noti-worker-dispatch
          image: lifegoeson34/be-modami-noti-service-worker-dispatch:latest
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: config-output
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config-output
          emptyDir: {}
