apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-worker-service
  namespace: techinsight
  labels:
    app: be-worker-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: be-worker-service
  template:
    metadata:
      labels:
        app: be-worker-service
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-limits-cpu: "50m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/role: "be-worker-service"
        vault.hashicorp.com/agent-inject-token: "true"
    spec:
      serviceAccountName: be-worker-service
      initContainers:
        - name: consul-template
          image: hashicorp/consul-template:0.37.6
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          env:
            - name: CONSUL_HTTP_ADDR
              value: "http://consul-server.consul.svc.cluster.local:8500"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
          volumeMounts:
            - name: config-output
              mountPath: /app/configs
          command:
            - /bin/sh
            - -c
            - |
              export VAULT_ADDR="${VAULT_ADDR:-http://vault.vault.svc.cluster.local:8200}"
              if [ -f /vault/secrets/token ]; then export VAULT_TOKEN=$(cat /vault/secrets/token); elif [ -f /vault/secrets/.vault-token ]; then export VAULT_TOKEN=$(cat /vault/secrets/.vault-token); fi
              wget -qO /tmp/tpl.yml "${CONSUL_HTTP_ADDR}/v1/kv/techinsight/templates/be-worker-service?raw"
              consul-template -template "/tmp/tpl.yml:/app/configs/config.yml" -once
      containers:
        - name: worker
          image: lifegoeson34/techinsight-core-service:latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: CONFIG_FILEPATH
              value: "/app/configs/config.yml"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          volumeMounts:
            - name: config-output
              mountPath: /app/configs
              readOnly: true
          command: ["/bin/sh", "-c", "exec ./worker"]
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -f /app/configs/config.yml"]
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /app/configs/config.yml"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config-output
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: be-worker-service
  namespace: techinsight
spec:
  selector:
    app: be-worker-service
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
