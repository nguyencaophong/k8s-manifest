apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: techbross.dev@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            ingressClassName: kong
            ingressTemplate:
              metadata:
                annotations:
                  # Higher priority so ACME challenge route is matched before main app ingress
                  konghq.com/regex-priority: "100"
