apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo1
  namespace: techinsight
  labels:
    app: mongo1
spec:
  serviceName: mongo1
  replicas: 1
  selector:
    matchLabels:
      app: mongo1
  template:
    metadata:
      labels:
        app: mongo1
    spec:
      containers:
        - name: mongo
          image: mongo:8
          command: ["mongod", "--bind_ip_all", "--replSet", "rs0"]
          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "rs.status().ok"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo1
  namespace: techinsight
spec:
  selector:
    app: mongo1
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
