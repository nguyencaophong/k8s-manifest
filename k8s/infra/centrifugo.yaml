apiVersion: apps/v1
kind: Deployment
metadata:
  name: centrifugo
  namespace: modami
  labels:
    app: centrifugo
spec:
  replicas: 0
  selector:
    matchLabels:
      app: centrifugo
  template:
    metadata:
      labels:
        app: centrifugo
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-limits-cpu: "50m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/role: "centrifugo"
        vault.hashicorp.com/agent-inject-token: "true"
    spec:
      serviceAccountName: centrifugo
      enableServiceLinks: false
      initContainers:
        - name: consul-template
          image: hashicorp/consul-template:0.37.6
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          env:
            - name: CONSUL_HTTP_ADDR
              value: "http://consul-server.consul.svc.cluster.local:8500"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
          volumeMounts:
            - name: config-output
              mountPath: /app/config
          command:
            - /bin/sh
            - -c
            - |
              export VAULT_ADDR="${VAULT_ADDR:-http://vault.vault.svc.cluster.local:8200}"
              if [ -f /vault/secrets/token ]; then export VAULT_TOKEN=$(cat /vault/secrets/token); elif [ -f /vault/secrets/.vault-token ]; then export VAULT_TOKEN=$(cat /vault/secrets/.vault-token); fi
              wget -qO /tmp/tpl.yml "${CONSUL_HTTP_ADDR}/v1/kv/modami/templates/centrifugo?raw"
              consul-template -template "/tmp/tpl.yml:/app/config/centrifugo.json" -once
      containers:
        - name: centrifugo
          image: centrifugo/centrifugo:v5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 10000
              name: grpc-api
          volumeMounts:
            - name: config-output
              mountPath: /app/config
              readOnly: true
          command: ["/bin/sh", "-c", "exec centrifugo --config=/app/config/centrifugo.json"]
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: config-output
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: centrifugo
  namespace: modami
spec:
  selector:
    app: centrifugo
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc-api
      port: 10000
      targetPort: 10000
  type: ClusterIP
