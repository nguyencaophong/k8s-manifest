# Strimzi Kafka cluster - KRaft mode (no ZooKeeper)
# Requires: Strimzi Cluster Operator running and watching this namespace.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  namespace: techinsight
  labels:
    strimzi.io/cluster: techinsight-kafka
spec:
  replicas: 1
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        class: local-path
        deleteClaim: false
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "500m"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: techinsight
  labels:
    strimzi.io/cluster: techinsight-kafka
spec:
  replicas: 1
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: local-path
        deleteClaim: false
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: techinsight-kafka
  namespace: techinsight
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 4.0.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: true
      log.retention.hours: 168
      log.segment.bytes: 1073741824
      num.partitions: 3
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: techinsight
  labels:
    strimzi.io/cluster: techinsight-kafka
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      - pattern: "kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value"
        name: "kafka_server_$1_$2"
        type: GAUGE
        labels:
          clientId: "$3"
          topic: "$4"
          partition: "$5"
      - pattern: "kafka.server<type=(.+), name=(.+)><>Value"
        name: "kafka_server_$1_$2"
        type: GAUGE
      - pattern: "kafka.server<type=(.+), name=(.+)><>OneMinuteRate"
        name: "kafka_server_$1_$2_one_minute_rate"
        type: GAUGE
---
# ExternalName alias so existing configs referencing "broker:29092" still work
# Strimzi bootstrap service: techinsight-kafka-kafka-bootstrap:9092
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: techinsight
spec:
  type: ExternalName
  externalName: techinsight-kafka-kafka-bootstrap.techinsight.svc.cluster.local
