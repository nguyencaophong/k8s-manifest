{{- with secret "secret/data/modami/be-modami-noti-service" }}
app:
  name: "Modami chat"
  version: "1.0.0"
  environment: "production"
  debug: false
  port: 8089
  host: "0.0.0.0"
  shutdown_timeout: 30s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  cors_origins:
    - "*"

mongodb:
  uri: "mongodb://mongo1.techinsight.svc.cluster.local:27017/?directConnection=true"
  database: "modami-noti-service"
  timeout: 10s
  max_pool_size: 100
  min_pool_size: 0
  max_idle_time: 900s
  retry_writes: true
  read_concern: "majority"
  write_concern: "majority"
  enable_logging: false

redis:
  host: "redis.techinsight.svc.cluster.local"

  port: 6379
  database: 6
  rate_limit_database: 5
  ttl: 259200s
  pool_size: 100
  pass: "{{ .Data.data.redis_password }}"
  user_name: ""
  write_timeout: 600s
  read_timeout: 600s
  dial_timeout: 600s
  tls_config:
    insecure_skip_verify: true

kafka:
  broker_list: "techinsight-kafka-kafka-bootstrap.techinsight.svc.cluster.local:9092"
  enable: true
  tls_enable: false
  partition: 1
  partitioner: "random"
  sasl_producer_username: ""
  sasl_producer_password: ""
  sasl_consumer_username: ""
  sasl_consumer_password: ""
  user_activated_topic_name: "modami.auth.user.activated"
  consumer_group: "noti-service-group"
  client_id: "noti-service"
  env: "production"

queue:
  ws_key: "notif:ws"
  push_key: "notif:push"

servers:
  api_addr: ":7070"
  ingest_addr: ":7071"
  gateway_addr: ":7072"

fcm:
  credentials_path: "/app/config/fcm-credentials.json"

centrifugo:
  api_url: "http://centrifugo.modami.svc.cluster.local:8000/api"
  api_key: "{{ .Data.data.centrifugo_api_key }}"
  hmac_secret: "{{ .Data.data.centrifugo_hmac_secret }}"
  token_ttl: 3600

observability:
  service_name: "noti-service"
  service_version: "1.0.0"
  environment: "production"
  log_level: "info"
  otlp_endpoint: ""
  otlp_insecure: true
{{- end }}
