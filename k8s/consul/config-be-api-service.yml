# Config be-api-service — CHỈ non-secret. Secret (JWT, DB, Redis, MinIO, ...) lấy từ Vault (env).
# Load: consul kv put techinsight/config/be-api-service @config-be-api-service.yml
app:
  name: "TechInsight API"
  version: "1.0.0"
  environment: "production"
  debug: false
  port: 8080
  host: "0.0.0.0"
  shutdown_timeout: 30s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
server:
  cors:
    allowed_origins:
      - "https://techinsightsworld.com"
      - "https://api.techinsightsworld.com"
      - "https://admin.techinsightsworld.com"
    allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    allowed_headers: ["Content-Type", "Authorization", "X-Requested-With", "X-Trace-Id"]
    expose_headers: ["X-Total-Count"]
    allow_credentials: true
    max_age: 3600
  rate_limit:
    enabled: true
    requests_per_minute: 100
    burst: 50
database:
  mongodb:
    database: "techinsight"
    timeout: 10s
    max_pool_size: 100
    min_pool_size: 0
cache:
  redis:
    addr: "redis:6379"
    db: 0
    pool_size: 10
kafka:
  brokers: ["techinsight-kafka-kafka-bootstrap:9092"]
  client_id: "techinsight-api"
  consumer_group_id: "techinsight-api-group"
logging:
  level: "info"
  format: "json"
  output: "stdout"
tracing:
  enabled: true
  service_name: "techinsight-api"
  otel:
    exporter_otlp_endpoint: "otel-collector:4317"
    endpoint: "otel-collector:4317"
    service_name: "techinsight-api"
auth:
  grpc:
    addr: "be-auth-service:50051"
security:
  jwt:
    expiration: "24h"
    refresh_expiration: "168h"
    issuer: "techinsight-api"
  bcrypt:
    cost: 12
elasticsearch:
  url: "http://elasticsearch:9200"
  index: "techinsight"
external:
  storage:
    provider: "minio"
    minio:
      endpoint: "minio:9000"
      use_ssl: false
      bucket_name: "techinsight"
      public_url: "https://minio.techinsightsworld.com"
storage:
  provider: "minio"
  minio:
    endpoint: "minio:9000"
    use_ssl: false
    bucket_name: "techinsight"
    public_url: "https://minio.techinsightsworld.com"
