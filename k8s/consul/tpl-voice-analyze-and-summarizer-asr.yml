{{- with secret "secret/data/lingocast/voice-analyze-and-summarizer-asr" -}}
FLASK_ENV=production
SECRET_KEY={{ .Data.data.flask_secret_key }}
PORT=5000

MONGO_URI={{ .Data.data.mongodb_uri }}

KAFKA_BOOTSTRAP_SERVERS=techinsight-kafka-kafka-bootstrap.techinsight.svc.cluster.local:9092
KAFKA_TRANSCRIPTION_REQUESTS=audio-transcription-requests
KAFKA_TRANSCRIPTION_RESULTS=audio-transcription-results
KAFKA_DIALOG_RESULTS=meeting-dialog-results
KAFKA_SUMMARIES=meeting-summaries

MINIO_ENDPOINT=minio.techinsight.svc.cluster.local:9000
MINIO_ACCESS_KEY={{ .Data.data.minio_access_key }}
MINIO_SECRET_KEY={{ .Data.data.minio_secret_key }}
MINIO_BUCKET=lingocast
MINIO_SECURE=false

CELERY_BROKER_URL={{ .Data.data.redis_url }}
CELERY_RESULT_BACKEND={{ .Data.data.redis_url }}

WHISPER_MODEL=base

OPENAI_API_KEY={{ .Data.data.openai_api_key }}
OPENAI_MODEL=gpt-4o
OPENAI_MAX_TOKENS=2000
OPENAI_TEMPERATURE=0.3

VAD_AGGRESSIVENESS=2
SESSION_TIMEOUT_MINUTES=30
{{- end }}
