# Config be-worker-service — CHỈ non-secret. Secret lấy từ Vault (env).
app:
  name: "TechInsight Worker"
  version: "1.0.0"
  environment: "production"
  debug: false
  port: 8080
  host: "0.0.0.0"
database:
  mongodb:
    database: "techinsight"
    timeout: 10s
    max_pool_size: 100
    min_pool_size: 0
cache:
  redis:
    addr: "redis:6379"
    db: 0
    pool_size: 10
kafka:
  brokers: ["techinsight-kafka-kafka-bootstrap:9092"]
  client_id: "techinsight-worker"
  consumer_group_id: "techinsight-api-group"
logging:
  level: "info"
  format: "json"
  output: "stdout"
tracing:
  enabled: true
  service_name: "techinsight-worker"
  otel:
    exporter_otlp_endpoint: "otel-collector:4317"
    endpoint: "otel-collector:4317"
    service_name: "techinsight-worker"
auth:
  grpc:
    addr: "be-auth-service:50051"
security:
  jwt:
    expiration: "24h"
  bcrypt:
    cost: 12
elasticsearch:
  url: "http://elasticsearch:9200"
  index: "techinsight"
external:
  storage:
    provider: "minio"
    minio:
      endpoint: "minio:9000"
      use_ssl: false
      bucket_name: "techinsight"
storage:
  provider: "minio"
  minio:
    endpoint: "minio:9000"
    use_ssl: false
    bucket_name: "techinsight"
    public_url: "https://minio.techinsightsworld.com"
