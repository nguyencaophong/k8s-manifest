# Config be-auth-service — CHỈ non-secret. Secret (JWT, DB, Redis, ...) lấy từ Vault (env).
app:
  name: "TechInsight Auth"
  version: "1.0.0"
  environment: "production"
  debug: false
  port: 50051
auth:
  grpc:
    addr: "0.0.0.0:50051"
security:
  jwt:
    expiration: "24h"
  bcrypt:
    cost: 12
database:
  mongodb:
    database: "techinsight"
    timeout: 10s
    max_pool_size: 50
    min_pool_size: 0
cache:
  redis:
    addr: "redis:6379"
    db: 0
    pool_size: 10
logging:
  level: "info"
  format: "json"
  output: "stdout"
