{{- with secret "secret/data/lingocast/be-lingocast-job-scheduler" }}
app:
  name: "Lingocast job scheduler"
  version: "1.0.0"
  environment: "production"
  debug: true
  ytdlp_cookies_file: "/app/config/yt-cookies.txt"
  storage_source: "minio"

mongodb:
  uri: "{{ .Data.data.mongodb_uri }}"
  database: "{{ .Data.data.mongodb_database }}"
  timeout: 10s
  max_pool_size: 100
  min_pool_size: 0
  max_idle_time: 900s
  retry_writes: true
  read_concern: "majority"
  write_concern: "majority"
  enable_logging: false

# Same host+database as be-lingocast-core-service's asynq client — the scheduler
# dequeues/schedules the jobs core-service enqueues, so they must share one Redis DB.
redis:
  host: "redis.techinsight.svc.cluster.local"
  port: 6379
  database: 8
  pass: "{{ .Data.data.redis_password }}"
  user_name: ""
  write_timeout: 600s
  read_timeout: 600s
  dial_timeout: 600s
  tls_config:
    insecure_skip_verify: true

kafka:
  broker_list: "techinsight-kafka-kafka-bootstrap.techinsight.svc.cluster.local:9092"
  enable: true
  tls_enable: false
  partition: 1
  partitioner: "random"
  sasl_producer_username: ""
  sasl_producer_password: ""
  sasl_consumer_username: ""
  sasl_consumer_password: ""
  consumer_group: "lingocast-job-scheduler-group"
  client_id: "lingocast-job-scheduler"
  env: "production"

observability:
  service_name: "lingocast-job-scheduler"
  service_version: "1.0.0"
  environment: "production"
  log_level: "info"
  otlp_endpoint: "otel-collector.techinsight.svc.cluster.local:4317"
  otlp_insecure: true

minio:
  endpoint: "minio.techinsight.svc.cluster.local:9000"
  access_key: "{{ .Data.data.minio_access_key }}"
  secret_key: "{{ .Data.data.minio_secret_key }}"
  bucket: "lingocast"
  use_ssl: false
  public_url: "https://minio.techinsightsworld.com"

# Credentials ready; storage_source is still "minio" so this is standby until
# storage_source is switched to "r2".
r2:
  enable: true
  endpoint: "{{ .Data.data.r2_endpoint }}"
  access_key: "{{ .Data.data.r2_access_key }}"
  secret_key: "{{ .Data.data.r2_secret_key }}"
  bucket: "{{ .Data.data.r2_bucket }}"
  region: "auto"

asynq:
  concurrency: 10
{{- end }}
