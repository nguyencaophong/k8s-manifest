{{- with secret "secret/data/modami/be-modami-core-service" }}
name: "Modami core"
version: "1.0.0"
environment: "production"
debug: false
port: 8080
host: "0.0.0.0"
shutdown_timeout: 30s
read_timeout: 30s
write_timeout: 30s
idle_timeout: 120s

security:
  jwt_secret: "{{ .Data.data.jwt_secret }}"

cors:
  allowed_origins:
    - "https://modami.techinsightsworld.com"

mongodb:
  uri: "{{ .Data.data.mongodb_uri }}"
  database: "{{ .Data.data.mongodb_database }}"
  timeout: 10s
  max_pool_size: 100
  min_pool_size: 0
  max_idle_time: 900s
  retry_writes: true
  read_concern: "majority"
  write_concern: "majority"
  enable_logging: false

redis:
  host: "redis.techinsight.svc.cluster.local"
  port: 6379
  database: 3
  rate_limit_database: 5
  ttl: 259200s
  pool_size: 100
  pass: "{{ .Data.data.redis_password }}"
  user_name: ""
  write_timeout: 600s
  read_timeout: 600s
  dial_timeout: 600s
  tls_config:
    insecure_skip_verify: true

kafka:
  broker_list: "techinsight-kafka-kafka-bootstrap.techinsight.svc.cluster.local:9092"
  enable: true
  tls_enable: false
  partition: 1
  partitioner: "random"
  sasl_producer_username: ""
  sasl_producer_password: ""
  sasl_consumer_username: ""
  sasl_consumer_password: ""
  user_activated_topic_name: "modami.auth.user.activated"
  consumer_group: "core-service-group"
  client_id: "core-service"
  env: "production"

elasticsearch:
  enable: false
  url: ""
  username: "{{ .Data.data.elasticsearch_user }}"
  password: "{{ .Data.data.elasticsearch_password }}"
  index: ""

observability:
  service_name: "core-service"
  service_version: "1.0.0"
  environment: "production"
  log_level: "info"
  otlp_endpoint: "otel-collector.techinsight.svc.cluster.local:4317"
  otlp_insecure: true
{{- end }}
