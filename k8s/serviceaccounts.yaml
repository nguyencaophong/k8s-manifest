# Service accounts for Vault Kubernetes auth. Each workload uses its SA to authenticate to Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: be-api-service
  namespace: techinsight
  labels:
    app: be-api-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: be-worker-service
  namespace: techinsight
  labels:
    app: be-worker-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: be-auth-service
  namespace: techinsight
  labels:
    app: be-auth-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fe-service
  namespace: techinsight
  labels:
    app: fe-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fe-admin-service
  namespace: techinsight
  labels:
    app: fe-admin-service
---
# Optional: SA for Vault Agent Injector to use when reviewing JWT (if not using default reviewer)
# apiVersion: v1
# kind: ServiceAccount
