apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-auth-service
  namespace: techinsight
  labels:
    app: be-auth-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: be-auth-service
  template:
    metadata:
      labels:
        app: be-auth-service
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-requests-cpu: "50m"
        vault.hashicorp.com/agent-limits-cpu: "100m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/role: "be-auth-service"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/techinsight/be-auth-service"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/techinsight/be-auth-service" -}}
          {{ range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{ end }}
          {{- end -}}
    spec:
      serviceAccountName: be-auth-service
      initContainers:
        - name: consul-template
          image: hashicorp/consul-template:0.37.6
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          env:
            - name: CONSUL_HTTP_ADDR
              value: "http://consul-server.consul.svc.cluster.local:8500"
          volumeMounts:
            - name: config-output
              mountPath: /app/configs
            - name: consul-tpl
              mountPath: /tpl
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -a
              . /vault/secrets/config 2>/dev/null || true
              set +a
              consul-template -template "/tpl/be-auth-service.tpl:/app/configs/config.yml" -once
      containers:
        - name: auth
          image: lifegoeson34/techinsight-auth-service:latest
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          ports:
            - containerPort: 50051
              name: grpc
          volumeMounts:
            - name: config-output
              mountPath: /app/configs
              readOnly: true
          command: ["/bin/sh", "-c", "set -a; . /vault/secrets/config 2>/dev/null || true; set +a; exec ./main"]
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config-output
          emptyDir: {}
        - name: consul-tpl
          configMap:
            name: consul-templates
            items:
              - key: be-auth-service.tpl
                path: be-auth-service.tpl
---
apiVersion: v1
kind: Service
metadata:
  name: be-auth-service
  namespace: techinsight
spec:
  selector:
    app: be-auth-service
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
  type: ClusterIP
