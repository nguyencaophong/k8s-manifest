apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: internal-mcp-rate-limiting
  namespace: internal-mcp
plugin: rate-limiting
config:
  minute: 300
  hour: 5000
  limit_by: ip
  policy: local
  fault_tolerant: true
  hide_client_headers: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internal-mcp-ingress
  namespace: internal-mcp
  annotations:
    konghq.com/strip-path: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    konghq.com/plugins: internal-mcp-rate-limiting
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - mcp-server.techinsightsworld.com
      secretName: internal-mcp-tls
  rules:
    - host: mcp-server.techinsightsworld.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-server
                port:
                  number: 3333
