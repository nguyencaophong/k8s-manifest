apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-image-watcher
  namespace: internal-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-image-watcher
  namespace: internal-mcp
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-image-watcher
  namespace: internal-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-image-watcher
subjects:
  - kind: ServiceAccount
    name: mcp-image-watcher
    namespace: internal-mcp
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mcp-image-watcher
  namespace: internal-mcp
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: mcp-image-watcher
          restartPolicy: Never
          containers:
            - name: watcher
              image: alpine/k8s:1.28.3
              command:
                - /bin/sh
                - -c
                - |
                  CURRENT=$(kubectl get pods -n internal-mcp -l app=mcp-server \
                    -o jsonpath='{.items[0].status.containerStatuses[0].imageID}' 2>/dev/null \
                    | sed 's/.*@//')

                  TOKEN=$(curl -s \
                    "https://auth.docker.io/token?service=registry.docker.io&scope=repository:lifegoeson34/mcp-server:pull" \
                    | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')

                  LATEST=$(curl -sI \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                    "https://registry-1.docker.io/v2/lifegoeson34/mcp-server/manifests/latest" \
                    | grep -i "docker-content-digest" | awk '{print $2}' | tr -d '\r\n')

                  echo "Running digest : ${CURRENT:-unknown}"
                  echo "Registry digest: ${LATEST:-unknown}"

                  if [ -z "$LATEST" ]; then
                    echo "Could not reach registry, skipping"
                    exit 0
                  fi

                  if [ "$CURRENT" != "$LATEST" ]; then
                    echo "New image detected — triggering rollout restart"
                    kubectl rollout restart deployment/mcp-server -n internal-mcp
                  else
                    echo "Digest unchanged — no restart needed"
                  fi
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "10m"
                limits:
                  memory: "64Mi"
                  cpu: "50m"
