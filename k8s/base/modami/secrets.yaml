# Replace placeholder values with base64-encoded secrets before apply.
# Example: echo -n "your-jwt-secret" | base64
apiVersion: v1
kind: Secret
metadata:
  name: modami-secrets
  namespace: modami
type: Opaque
stringData:
  # Uncomment and set in CI or replace with real values
  # JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  # REDIS_PASSWORD: ""
  JWT_SECRET: "change-me-in-production"
