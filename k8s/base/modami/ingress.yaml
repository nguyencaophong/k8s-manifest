# ExternalName services trong techinsight namespace trỏ sang modami namespace
# Kong Ingress Controller chỉ route tới services cùng namespace với Ingress
---
apiVersion: v1
kind: Service
metadata:
  name: modami-auth-proxy
  namespace: techinsight
spec:
  type: ExternalName
  externalName: be-modami-auth-service.modami.svc.cluster.local
  ports:
    - name: http
      port: 8085
---
apiVersion: v1
kind: Service
metadata:
  name: modami-user-proxy
  namespace: techinsight
spec:
  type: ExternalName
  externalName: be-modami-user-service.modami.svc.cluster.local
  ports:
    - name: http
      port: 8086
    - name: grpc
      port: 50050
---
apiVersion: v1
kind: Service
metadata:
  name: modami-core-proxy
  namespace: techinsight
spec:
  type: ExternalName
  externalName: be-modami-core-service.modami.svc.cluster.local
  ports:
    - name: http
      port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: modami-keycloak-proxy
  namespace: techinsight
spec:
  type: ExternalName
  externalName: keycloak.modami.svc.cluster.local
  ports:
    - name: http
      port: 8180
---
apiVersion: v1
kind: Service
metadata:
  name: modami-noti-api-proxy
  namespace: techinsight
spec:
  type: ExternalName
  externalName: be-modami-noti-service-api.modami.svc.cluster.local
  ports:
    - name: http
      port: 7070
---
apiVersion: v1
kind: Service
metadata:
  name: modami-noti-ws-proxy
  namespace: techinsight
spec:
  type: ExternalName
  externalName: centrifugo.modami.svc.cluster.local
  ports:
    - name: http
      port: 8000
---
# Ingress trong techinsight namespace (cùng namespace với Kong)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modami-ingress
  namespace: techinsight
  annotations:
    konghq.com/strip-path: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - auth.modami.cloud
        - user.modami.cloud
        - core.modami.cloud
        - noti.modami.cloud
        - ws.modami.cloud
        - keycloak.modami.cloud
      secretName: modami-tls
  rules:
    - host: auth.modami.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: modami-auth-proxy
                port:
                  number: 8085
    - host: keycloak.modami.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: modami-keycloak-proxy
                port:
                  number: 8180
    - host: user.modami.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: modami-user-proxy
                port:
                  number: 8086
    - host: core.modami.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: modami-core-proxy
                port:
                  number: 8080
    - host: noti.modami.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: modami-noti-api-proxy
                port:
                  number: 7070
    - host: ws.modami.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: modami-noti-ws-proxy
                port:
                  number: 8000
