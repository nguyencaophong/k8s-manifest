# Requires Kong Ingress Controller installed (e.g. helm install kong kong/kong -n kong).
# Apply after Kong is running; set ingressClassName to the one provided by your Kong install.
# CORS plugin: trả CORS headers cho preflight (OPTIONS) và response (techinsightsworld.com -> api.techinsightsworld.com).

---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: techinsight-rate-limiting
  namespace: techinsight
plugin: rate-limiting
config:
  minute: 60
  hour: 1000
  limit_by: ip
  policy: local
  fault_tolerant: true
  hide_client_headers: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: techinsight-ingress
  namespace: techinsight
  annotations:
    konghq.com/strip-path: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    konghq.com/plugins: techinsight-rate-limiting
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - api.techinsightsworld.com
        - admin.techinsightsworld.com
        - minio.techinsightsworld.com
        - minio-console.techinsightsworld.com
        - kibana.techinsightsworld.com
        - redpanda.techinsightsworld.com
        - jenkins.techinsightsworld.com

      secretName: techinsight-api-tls
    - hosts:
        - techinsightsworld.com
        - www.techinsightsworld.com
      secretName: techinsight-web-tls
  rules:
    - host: api.techinsightsworld.com
      http:
        paths:
          - path: /v1/auth-services
            pathType: Prefix
            backend:
              service:
                name: be-auth-service
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: be-api-service
                port:
                  number: 8080
    - host: techinsightsworld.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fe-service
                port:
                  number: 3000
    - host: www.techinsightsworld.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fe-service
                port:
                  number: 3000
    - host: admin.techinsightsworld.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fe-admin-service
                port:
                  number: 3000
    - host: minio.techinsightsworld.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
    - host: minio-console.techinsightsworld.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9001
    - host: kibana.techinsightsworld.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana
                port:
                  number: 5601
    - host: redpanda.techinsightsworld.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redpanda-console
                port:
                  number: 8080
    - host: jenkins.techinsightsworld.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  number: 8080
