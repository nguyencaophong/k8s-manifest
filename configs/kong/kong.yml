_format_version: "3.0"
_transform: true

services:
  - name: be-api-service
    url: http://be-api-service:8080
    routes:
      - name: api-route
        hosts:
          - api.techinsightsworld.com
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - https://admin.techinsightsworld.com
            - https://techinsightsworld.com
            - http://localhost:3000
            - http://localhost:5173
          methods:
            - GET
            - PUT
            - POST
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Content-Type
            - Authorization
            - X-Requested-With
            - Origin
            - Accept
            - Access-Control-Allow-Origin
            - X-Trace-Id
            - X-Request-Id
          exposed_headers:
            - "*"
          credentials: true

  - name: fe-service
    url: http://fe-service:3000
    routes:
      - name: web-route
        hosts:
          - techinsightsworld.com
          - www.techinsightsworld.com
        strip_path: false

  - name: fe-admin-service
    url: http://fe-admin-service:3000
    routes:
      - name: admin-route
        hosts:
          - admin.techinsightsworld.com
        strip_path: false

  - name: minio-api
    url: http://minio:9000
    routes:
      - name: minio-route
        hosts:
          - minio.techinsightsworld.com
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - https://admin.techinsightsworld.com
            - https://techinsightsworld.com
          methods:
            - GET
            - PUT
            - POST
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - "*"
          exposed_headers:
            - ETag

  - name: minio-console
    url: http://minio:9001
    routes:
      - name: minio-console-route
        hosts:
          - minio-console.techinsightsworld.com
        strip_path: false
