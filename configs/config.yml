# Application configuration
app:
  name: "TechInsight API"
  version: "1.0.0"
  environment: "development"
  debug: true
  port: 8080
  host: "0.0.0.0"
  shutdown_timeout: 30s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

# Server configuration
server:
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
      - "http://localhost:5173"
      - "https://techinsightsworld.com"
      - "https://api.techinsightsworld.com"
      - "https://admin.techinsightsworld.com"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "Content-Type"
      - "Authorization"
      - "X-Requested-With"
      - "X-Trace-Id"
    expose_headers:
      - "X-Total-Count"
    allow_credentials: true
    max_age: 3600

  rate_limit:
    enabled: true
    requests_per_minute: 100
    burst: 50

# Database configuration
database:
  mongodb:
    uri: "mongodb://mongo1:27017/techinsight?replicaSet=rs0"
    database: "techinsight"
    timeout: 10s
    max_pool_size: 100
    min_pool_size: 0
    max_idle_time: 900s
    retry_writes: true
    read_concern: "majority"
    write_concern: "majority"
    enable_logging: true

# Cache configuration
cache:
  redis:
    addr: "redis:6379"
    password: ""
    db: 0
    pool_size: 10
    min_idle_conns: 0
    dial_timeout: 5s
    read_timeout: 3s
    write_timeout: 3s
    pool_timeout: 4s
    idle_timeout: 300s
    max_retries: 3
    retry_delay: 100ms

# Message queue configuration
kafka:
  brokers:
    - "broker:29092"
  client_id: "techinsight-api"
  consumer_group_id: "techinsight-api-group"
  consumer:
    group_id: "techinsight-api"
    session_timeout: 10s
    heartbeat_interval: 3s
    rebalance_timeout: 60s
    fetch_min: 1
    fetch_default: 1048576
    fetch_max: 10485760
    retry_backoff: 100ms
  producer:
    max_message_size: 1000000
    flush_frequency: 10ms
    compression: "snappy"
    retry_max: 3
    retry_backoff: 100ms
    required_acks: 1

# Logging configuration
logging:
  level: "info"
  format: "json"
  output: "stdout"
  file_path: "./logs/app.log"
  max_size: 100
  max_backups: 7
  max_age: 30
  compress: true
  caller: true
  stacktrace: false

# Tracing configuration
tracing:
  enabled: true
  service_name: "techinsight-api"
  service_version: "1.0.0"
  otel:
    exporter_otlp_endpoint: "otel-collector:4317"
    endpoint: "otel-collector:4317"
    service_name: "techinsight-api"
  jaeger:
    endpoint: "http://localhost:14268/api/traces"
    sampler_type: "const"
    sampler_param: 1.0
    agent_host: "localhost"
    agent_port: 6831
    buffer_flush_interval: 1s

# WebSocket configuration
websocket:
  enabled: true
  path: "/ws"
  read_buffer_size: 1024
  write_buffer_size: 1024
  handshake_timeout: 10s
  check_origin: true
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "https://techinsightsworld.com"

# Auth service (gRPC)
auth:
  grpc:
    addr: "be-auth-service:50051"

# Security configuration
security:
  jwt:
    secret: "your-super-secret-jwt-key-change-in-production-please"
    expiration: "24h"
    refresh_expiration: "168h"
    issuer: "techinsight-api"

  bcrypt:
    cost: 12

  session:
    cookie_name: "techinsight_session"
    cookie_secure: false
    cookie_http_only: true
    cookie_same_site: "lax"
    max_age: 86400

# Feature flags
features:
  user_registration: true
  email_verification: true
  password_reset: true
  social_login: false
  premium_features: false
  analytics: true

# Email configuration
email:
