receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
 
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
 
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512
 
  resource:
    attributes:
      - key: service.name
        from_attribute: service.name
        action: upsert
      - key: environment
        value: poc
        action: upsert
 
  transform/logs:
    log_statements:
      - context: log
        statements:
 
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    compression: gzip
    timeout: 30s
 
  elasticsearch/logs:
    endpoints: ["http://elasticsearch:9200"]
    user: elastic
    password: ${env:ELASTICSEARCH_PASSWORD}
    logs_index: logs-app
    logs_dynamic_index:
      enabled: true
    mapping:
      mode: raw
    timeout: 30s
 
  debug:
    verbosity: detailed
 
  prometheus:
    endpoint: "0.0.0.0:8889"
 
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679
 
service:
  extensions: [health_check, pprof, zpages]
 
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/jaeger, debug]
 
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, transform/logs]
      exporters: [elasticsearch/logs, debug]
 
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
     
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      address: 0.0.0.0:8888