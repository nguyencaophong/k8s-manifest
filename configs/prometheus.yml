global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    scrape_interval: 10s
    metrics_path: /metrics

  # OpenTelemetry Collector Prometheus exporter
  - job_name: 'otel-prometheus-exporter'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 15s

  # Elasticsearch metrics
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    metrics_path: /_prometheus/metrics
    scrape_interval: 30s

  # APM Server metrics
  - job_name: 'apm-server'
    static_configs:
      - targets: ['apm-server:5066']
    metrics_path: /stats
    scrape_interval: 30s

  # Application metrics
  - job_name: 'techinsight-api'
    static_configs:
      - targets: ['host.docker.internal:8080'] # Main API service
    metrics_path: /metrics
    scrape_interval: 15s

  # Redis metrics (if redis_exporter is added)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics
    scrape_interval: 30s

  # MongoDB metrics (if mongodb_exporter is added)
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongo1:27017']
    metrics_path: /metrics
    scrape_interval: 30s

  # Kafka metrics (via JMX)
  - job_name: 'kafka'
    static_configs:
      - targets: ['broker:9101']
    scrape_interval: 30s
